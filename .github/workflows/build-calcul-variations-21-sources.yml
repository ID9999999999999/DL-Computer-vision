name: Build faithful 21-source Calcul des Variations PDF

on:
  push:
    branches:
      - calcul-variations-notes
    paths:
      - "notes/calcul-des-variations/rebuild_variations_21_sources.tex.gz.b64"
      - ".github/workflows/build-calcul-variations-21-sources.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: calcul-variations-notes

      - name: Install XeLaTeX and handwriting font
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra fonts-comic-neue

      - name: Restore TeX source
        run: |
          base64 -d notes/calcul-des-variations/rebuild_variations_21_sources.tex.gz.b64 | gunzip > /tmp/rebuild_variations_21_sources.tex

      - name: Build faithful PDF
        run: |
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp /tmp/rebuild_variations_21_sources.tex
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp /tmp/rebuild_variations_21_sources.tex
          cp /tmp/rebuild_variations_21_sources.pdf notes/calcul-des-variations/Calcul_des_variations_21_feuilles_version_fidele.pdf
          pdfinfo notes/calcul-des-variations/Calcul_des_variations_21_feuilles_version_fidele.pdf | grep Pages || true
          ls -lh notes/calcul-des-variations/Calcul_des_variations_21_feuilles_version_fidele.pdf

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/calcul-des-variations/Calcul_des_variations_21_feuilles_version_fidele.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build faithful 21-source calculus of variations PDF"
            git push origin calcul-variations-notes
          fi
