name: Build Calcul des Variations PDF

on:
  push:
    branches:
      - calcul-variations-notes
    paths:
      - "notes/calcul-des-variations/calcul_variations_long.html.gz.b64"
      - ".github/workflows/build-calcul-variations-pdf.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: calcul-variations-notes

      - name: Install font and PDF renderer
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-comic-neue
          python -m pip install --upgrade pip
          python -m pip install weasyprint

      - name: Restore HTML source
        run: |
          base64 -d notes/calcul-des-variations/calcul_variations_long.html.gz.b64 | gunzip > /tmp/calcul_variations_long.html

      - name: Build high-quality PDF
        run: |
          weasyprint /tmp/calcul_variations_long.html notes/calcul-des-variations/Calcul_des_variations_manuscrit_40_pages.pdf
          ls -lh notes/calcul-des-variations/Calcul_des_variations_manuscrit_40_pages.pdf

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/calcul-des-variations/Calcul_des_variations_manuscrit_40_pages.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build long calculus of variations PDF"
            git push origin calcul-variations-notes
          fi
