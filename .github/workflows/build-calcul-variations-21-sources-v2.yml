name: Build faithful 21-source PDF v2

on:
  push:
    branches:
      - calcul-variations-notes
    paths:
      - "notes/calcul-des-variations/rebuild_variations_21_sources.tex"
      - ".github/workflows/build-calcul-variations-21-sources-v2.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: calcul-variations-notes
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y texlive-xetex texlive-latex-extra fonts-comic-neue poppler-utils
      - name: Build PDF
        run: |
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp notes/calcul-des-variations/rebuild_variations_21_sources.tex
          xelatex -interaction=nonstopmode -halt-on-error -output-directory=/tmp notes/calcul-des-variations/rebuild_variations_21_sources.tex
          cp /tmp/rebuild_variations_21_sources.pdf notes/calcul-des-variations/Calcul_des_variations_21_feuilles_version_fidele.pdf
          pdfinfo notes/calcul-des-variations/Calcul_des_variations_21_feuilles_version_fidele.pdf | grep Pages
          ls -lh notes/calcul-des-variations/Calcul_des_variations_21_feuilles_version_fidele.pdf
      - name: Commit PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/calcul-des-variations/Calcul_des_variations_21_feuilles_version_fidele.pdf
          if git diff --cached --quiet; then
            echo "No PDF changes to commit."
          else
            git commit -m "Build faithful 21-source calculus PDF"
            git push origin calcul-variations-notes
          fi
