name: Lab06 Task5D ONNX Export Smoke Test

on:
  push:
    branches:
      - lab06-model-selection-2473986-20261025
    paths:
      - .github/workflows/lab06-task5d-onnx.yml
      - LAB06_Model_Selection/scripts/task5d_ci_export_smoke.py
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export-and-benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          python -m pip install 'ultralytics>=8.3,<9' 'onnx>=1.15' 'onnxruntime>=1.17' 'gdown>=5'
      - name: Download user's already-shared YOLOv8n model package
        run: |
          gdown 'https://drive.google.com/uc?id=1z6TeWfS5vy6tc0PDvZFl_3F2CIyvzINk' -O /tmp/peer_package.zip
          unzip -q /tmp/peer_package.zip -d /tmp/peer_package
          test -f /tmp/peer_package/yolov8n_quality_gate/yolov8n_quality_gate.pt
          sha256sum /tmp/peer_package/yolov8n_quality_gate/yolov8n_quality_gate.pt
      - name: Export original checkpoint and benchmark CPU parity
        run: |
          python LAB06_Model_Selection/scripts/task5d_ci_export_smoke.py \
            --weights /tmp/peer_package/yolov8n_quality_gate/yolov8n_quality_gate.pt \
            --out /tmp/task5d_output
      - name: Publish ONNX + raw measurement evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lab06-task5d-onnx-cpu
          path: |
            /tmp/task5d_output/*.onnx
            /tmp/task5d_output/*.json
            /tmp/task5d_output/*.md
          if-no-files-found: warn
