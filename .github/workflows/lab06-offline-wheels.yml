name: Lab06 Offline Wheelhouse for Private Data Evaluation
on:
  push:
    branches:
      - lab06-model-selection-2473986-20261025
    paths:
      - .github/workflows/lab06-offline-wheels.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wheels:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download CPU inference wheels only (no data)
        run: |
          mkdir -p /tmp/lab06_wheels
          python -m pip download --only-binary=:all: --no-deps -d /tmp/lab06_wheels \
            'ultralytics==8.4.208' 'onnxruntime==1.31.1' 'onnx==1.23.2' \
            'ultralytics-thop==2.2.5' 'polars==2.1.0' 'polars-runtime-32==2.1.0' \
            'ultralytics-platform==0.1.107' 'flatbuffers==25.12.19' \
            'coloredlogs==15.0.1' 'humanfriendly==10.0' 'protobuf==7.36.2'
          ls -lh /tmp/lab06_wheels/
      - name: Publish wheels to authenticated artifact
        uses: actions/upload-artifact@v4
        with:
          name: lab06-offline-wheels-python313
          path: /tmp/lab06_wheels/*
          retention-days: 3
          if-no-files-found: error
